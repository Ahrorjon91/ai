<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Engineer Academy</title>
    <meta name="description" content="Портал обучения AI Engineer Academy: 24 практических модуля, лекции, интерактивные лаборатории, квизы и домашние задания." />
    <meta property="og:title" content="AI Engineer Academy" />
    <meta property="og:description" content="Портал обучения AI Engineer Academy: 24 практических модуля, лекции, интерактивные лаборатории, квизы и домашние задания." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Gracefully silence Vite HMR WebSocket connection failure in proxy/iframe sandbox
      if (typeof window !== 'undefined') {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function (url, protocols) {
            var isViteHmr = false;
            try {
              if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr'))) {
                isViteHmr = true;
              }
              var urlStr = String(url || '');
              if (urlStr.includes('24678') || urlStr.includes('vite-hmr')) {
                isViteHmr = true;
              }
            } catch (e) {}

            if (isViteHmr) {
              // Return a silent mock WebSocket that never fails or raises unhandled rejections
              return {
                readyState: 3, // CLOSED
                protocol: 'vite-hmr',
                url: String(url || ''),
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function () {},
                close: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
                dispatchEvent: function () { return true; }
              };
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite')) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (event) {
          var msg = (event && (event.message || '')) || '';
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite')) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
