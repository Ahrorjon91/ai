# Nixpacks Configuration
# Forces Dokploy to use Node.js provider and run the Express backend (server.ts),
# preventing Nixpacks from defaulting to Caddy static file server.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
